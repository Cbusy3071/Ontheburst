<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D2B20">
<meta name="description" content="On the Burst: rugby league highlights, trials and verified stats. Get your footy in front of selectors.">
<title>On the Burst</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body class="full">

<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#/" aria-label="On the Burst home">
      <svg width="36" height="36" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#FF5B1F"/><g transform="rotate(-30 21 21)"><path d="M5 16.4h7M3.5 21h8.5M5 25.6h7" stroke="#0D2B20" stroke-width="2.5" stroke-linecap="round"/><path d="M14.5 21C17.5 12.6 32.5 12.6 35.5 21C32.5 29.4 17.5 29.4 14.5 21Z" fill="#0D2B20"/><path d="M14.9 21C19 17.4 31 17.4 35.1 21M14.9 21C19 24.6 31 24.6 35.1 21" fill="none" stroke="#FF5B1F" stroke-width="1.35"/></g></svg>
      <span class="wm">On the <b>Burst</b></span>
    </a>
    <form class="search" id="searchForm" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="Search players, clubs, trials" aria-label="Search" enterkeyhint="search">
    </form>
    <a class="topsearch" href="#/search" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home"><svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l8.8 7.3V20a1 1 0 01-1 1h-5.3v-6h-5v6H4.2a1 1 0 01-1-1v-9.5z"/></svg>Home</a>
      <a href="#/trials" data-nav="trials"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4" stroke-linecap="round"/></svg>Trials</a>
      <a href="#/events" data-nav="events"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke-linecap="round"/></svg>Events</a>
      <a href="#/alerts" data-nav="alerts"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 004 0"/></svg><span class="pip" data-pip hidden></span>Alerts</a>
      <button type="button" data-menu="me" data-nav="me"><span class="av me-av" data-me-av></span>Me</button>
    </nav>
  </div>
</header>

<div class="acting" id="acting" hidden></div>

<main class="layout">
  <aside class="side leftcol" id="left"></aside>
  <section class="feed" id="main" aria-live="polite"></section>
  <aside class="side rightcol rr" id="right"></aside>
</main>

<nav class="bottomnav" aria-label="Main">
  <a href="#/" data-nav="home"><svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l8.8 7.3V20a1 1 0 01-1 1h-5.3v-6h-5v6H4.2a1 1 0 01-1-1v-9.5z"/></svg>Home</a>
  <a href="#/trials" data-nav="trials"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4" stroke-linecap="round"/></svg>Trials</a>
  <button type="button" class="post-btn" data-compose="" aria-label="Create a post"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <a href="#/alerts" data-nav="alerts"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 004 0"/></svg><span class="pip" data-pip hidden></span>Alerts</a>
  <button type="button" data-menu="me" data-nav="me"><span class="av me-av" data-me-av></span>Me</button>
</nav>

<div class="viewer" id="viewer" role="dialog" aria-label="Highlights" aria-modal="true">
  <div class="v-top">
    <button class="vbtn" id="vClose" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="ttl"><svg width="28" height="28" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#FF5B1F"/><g transform="rotate(-30 21 21)"><path d="M5 16.4h7M3.5 21h8.5M5 25.6h7" stroke="#0D2B20" stroke-width="2.5" stroke-linecap="round"/><path d="M14.5 21C17.5 12.6 32.5 12.6 35.5 21C32.5 29.4 17.5 29.4 14.5 21Z" fill="#0D2B20"/><path d="M14.9 21C19 17.4 31 17.4 35.1 21M14.9 21C19 24.6 31 24.6 35.1 21" fill="none" stroke="#FF5B1F" stroke-width="1.35"/></g></svg><span class="wm" style="font-size:21px">Highlights</span></span>
    <button class="vbtn" id="vMute" aria-label="Toggle sound"></button>
  </div>
  <div class="track" id="track"></div>
  <div class="v-nav">
    <button class="vbtn" id="vUp" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="vbtn" id="vDown" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
  </div>
  <div class="hint" id="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>Swipe up for the next highlight</div>
  <div class="sheet-bg" id="sheetBg"></div>
  <section class="sheet" id="sheet" aria-label="Comments">
    <div class="sheet-h"><span id="sheetTitle">Comments</span><button id="sheetClose" aria-label="Close comments"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-b" id="sheetBody"></div>
  </section>
</div>

<div id="full"></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
